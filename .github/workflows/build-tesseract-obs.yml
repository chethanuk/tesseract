          * ${CHANGELOG_DATE} GitHub Actions <actions@github.com> - ${{ env.TESSERACT_VERSION }}-1.amzn2023.leptonica${{ env.LEPTONICA_VERSION }}
          - Automated build of Tesseract OCR ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }} via GitHub Actions on Amazon Linux 2023.
          SPEC_EOF
          echo "SPEC_FILE_PATH=${SPEC_FILE_PATH}" >> $GITHUB_OUTPUT

      - name: Build RPM for Amazon Linux 2023
        run: |
          rpmbuild -bb ${HOME}/rpmbuild/SPECS/tesseract-ocr-al2023.spec --define "_sourcedir /tmp" --define "_topdir ${HOME}/rpmbuild"
          echo "Amazon Linux 2023 RPMs created:"
          find ${HOME}/rpmbuild/RPMS -name "*.rpm" -print

      - name: Upload Amazon Linux 2023 RPM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2023
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      - name: Upload Amazon Linux 2023 Spec File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-spec-al2023
          path: ~/rpmbuild/SPECS/tesseract-ocr-al2023.spec
          if-no-files-found: error

  publish_to_obs:
    needs: [build_and_package_tesseract, build_for_amazon_linux, build_for_amazon_linux_2023]
    runs-on: ubuntu-latest
    
    steps:
      - name: Install OBS CLI (osc)
        run: |
          sudo apt-get update
          sudo apt-get install -y osc

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm
          path: /tmp/tesseract-rpm-artifact

      - name: Download AlmaLinux 8 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-rhel8
          path: /tmp/tesseract-spec-artifact-rhel8

      - name: Download Amazon Linux 2 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2
          path: /tmp/tesseract-rpm-artifact-al2

      - name: Download Amazon Linux 2 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-al2
          path: /tmp/tesseract-spec-artifact-al2

      - name: Download Amazon Linux 2023 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2023
          path: /tmp/tesseract-rpm-artifact-al2023

      - name: Download Amazon Linux 2023 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-al2023
          path: /tmp/tesseract-spec-artifact-al2023

      - name: List downloaded artifacts
        run: |
          echo "Downloaded RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact
          echo "Spec artifact contents for RHEL8:"
          ls -R /tmp/tesseract-spec-artifact-rhel8
          echo "Amazon Linux 2 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2
          echo "Amazon Linux 2 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2
          echo "Amazon Linux 2023 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2023
          echo "Amazon Linux 2023 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2023

      - name: Configure OBS credentials
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          echo "Configuring OBS access..."
          if [ -z "$OBS_TOKEN" ]; then
            echo "Error: OBS_TOKEN secret is not set. Cannot proceed with OBS publishing."
            exit 1
          fi
          
          mkdir -p ~/.config/osc
          cat << 'OBS_CONFIG_EOF' > ~/.oscrc
          [general]
          apiurl = https://api.opensuse.org
          
          [https://api.opensuse.org]
          user = chethanuk
          pass = ${{ secrets.OBS_TOKEN }}
          OBS_CONFIG_EOF
          chmod 600 ~/.oscrc
          echo "OBS credentials configured."

      - name: Publish to OBS
        env:
          OBS_PROJECT: "home:chethanuk"
          OBS_PACKAGE: "tesseract5"
          SPEC_FILENAME_ENV: ${{ env.SPEC_FILENAME }}
        run: |
          echo "Publishing RPM to OBS project ${OBS_PROJECT}/${OBS_PACKAGE}"
          cd /tmp
          
          # Check if package exists, create if not
          if ! osc list "${OBS_PROJECT}" | grep -q "^${OBS_PACKAGE}$"; then
            echo "Package ${OBS_PACKAGE} does not exist in project ${OBS_PROJECT}. Creating..."
            osc mkpac "${OBS_PROJECT}" "${OBS_PACKAGE}"
          fi
          
          osc checkout "${OBS_PROJECT}/${OBS_PACKAGE}"
          
          if [ ! -d "${OBS_PROJECT}/${OBS_PACKAGE}" ]; then
            echo "Error: OBS checkout failed. Directory ${OBS_PROJECT}/${OBS_PACKAGE} not found."
            exit 1
          fi
          cd "${OBS_PROJECT}/${OBS_PACKAGE}"
          
          # Remove old files
          rm -f *.rpm
          rm -f *.spec
          
          # Copy new RPM
          RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact -name "*.rpm" -type f -print -quit)
          if [ -z "$RPM_FILE_PATH" ]; then
            echo "Error: RPM file not found in /tmp/tesseract-rpm-artifact."
            exit 1
          fi
          SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-rhel8 -name "*.spec" -type f -print -quit)
          if [ -z "$SPEC_FILE_PATH" ]; then
            echo "Error: Spec file not found in /tmp/tesseract-spec-artifact-rhel8."
            exit 1
          fi
          
          # Find Amazon Linux 2 files
          AL2_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2 RPM file not found."
            exit 1
          fi
          AL2_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2 Spec file not found."
            exit 1
          fi
          
          # Find Amazon Linux 2023 files
          AL2023_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2023 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2023_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 RPM file not found."
            exit 1
          fi
          AL2023_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2023 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2023_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 Spec file not found."
            exit 1
          fi
          
          # Copy new RPM
          cp "$RPM_FILE_PATH" .
          echo "Copied RPM: $(basename "$RPM_FILE_PATH")"
          
          # Copy spec file
          cp "$SPEC_FILE_PATH" .
          echo "Copied spec file: $(basename "$SPEC_FILE_PATH")"
          
          # Copy Amazon Linux 2 RPM
          cp "$AL2_RPM_FILE_PATH" .
          echo "Copied Amazon Linux 2 RPM: $(basename "$AL2_RPM_FILE_PATH")"
          
          # Copy Amazon Linux 2 spec file
          cp "$AL2_SPEC_FILE_PATH" .
          echo "Copied Amazon Linux 2 spec file: $(basename "$AL2_SPEC_FILE_PATH")"
          
          # Copy Amazon Linux 2023 RPM
          cp "$AL2023_RPM_FILE_PATH" .
          echo "Copied Amazon Linux 2023 RPM: $(basename "$AL2023_RPM_FILE_PATH")"
          
          # Copy Amazon Linux 2023 spec file
          cp "$AL2023_SPEC_FILE_PATH" .
          echo "Copied Amazon Linux 2023 spec file: $(basename "$AL2023_SPEC_FILE_PATH")"
          
          # Add new files to OBS
          echo "Adding new files to OBS..."
          osc addremove
          
          # Check status
          echo "OBS status:"
          osc status
          
          # Commit changes
          if osc status | grep -q 'nothing to commit'; then
            echo "OBS: No changes to commit."
          else
            osc commit -m "Update Tesseract OCR to ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }} from GitHub Actions"
            echo "OBS commit successful."
          fi

  publish_to_github_release:
    needs: [build_and_package_tesseract, build_for_amazon_linux, build_for_amazon_linux_2023]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm
          path: /tmp/tesseract-rpm-artifact

      - name: Download AlmaLinux 8 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-rhel8
          path: /tmp/tesseract-spec-artifact-rhel8

      - name: Download Amazon Linux 2 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2
          path: /tmp/tesseract-rpm-artifact-al2

      - name: Download Amazon Linux 2 Spec File artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-al2
          path: /tmp/tesseract-spec-artifact-al2

      - name: Download Amazon Linux 2023 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2023
          path: /tmp/tesseract-rpm-artifact-al2023

      - name: Download Amazon Linux 2023 Spec File artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-al2023
          path: /tmp/tesseract-spec-artifact-al2023

      - name: List downloaded artifacts for release
        run: |
          echo "RPM artifact contents for release:"
          ls -R /tmp/tesseract-rpm-artifact
          echo "Spec artifact contents for release:"
          ls -R /tmp/tesseract-spec-artifact-rhel8
          echo "Amazon Linux 2 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2
          echo "Amazon Linux 2 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2
          echo "Amazon Linux 2023 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2023
          echo "Amazon Linux 2023 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2023

      - name: Create GitHub Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ env.TESSERACT_VERSION }}-leptonica${{ env.LEPTONICA_VERSION }}
        run: |
          # Find RHEL 8 compatible files
          RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact -name "*.rpm" -type f -print -quit)
          if [ -z "$RPM_FILE_PATH" ]; then
            echo "Error: RPM file not found in /tmp/tesseract-rpm-artifact."
            exit 1
          fi
          SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-rhel8 -name "*.spec" -type f -print -quit)
          if [ -z "$SPEC_FILE_PATH" ]; then
            echo "Error: Spec file not found in /tmp/tesseract-spec-artifact-rhel8."
            exit 1
          fi
          
          # Find Amazon Linux 2 files
          AL2_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2 RPM file not found."
            exit 1
          fi
          AL2_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2 Spec file not found."
            exit 1
          fi
          
          # Find Amazon Linux 2023 files
          AL2023_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2023 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2023_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 RPM file not found."
            exit 1
          fi
          AL2023_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2023 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2023_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 Spec file not found."
            exit 1
          fi
          
          # Create release notes file
          cat << 'RELEASE_NOTES_EOF' > release_notes.md
          Automated release of Tesseract OCR ${{ env.TESSERACT_VERSION }} (custom build with Leptonica ${{ env.LEPTONICA_VERSION }}). 

          ## What's included:
          - AlmaLinux 8 RPM package (RHEL 8 compatible)
          - Amazon Linux 2 RPM package
          - Amazon Linux 2023 RPM package
          - RPM spec files for all three builds

          ## Installation:
          
          ### For RHEL 8 / AlmaLinux 8 / Rocky Linux 8:
          ```bash
          sudo rpm -i tesseract-ocr-custom-*el8*.rpm
          ```
          
          ### For Amazon Linux 2:
          ```bash
          sudo rpm -i tesseract-ocr-custom-*amzn2*.rpm
          ```
          
          ### For Amazon Linux 2023:
          ```bash
          sudo rpm -i tesseract-ocr-custom-*amzn2023*.rpm
          ```
          
          ### Verify installation:
          ```bash
          tesseract --version
          ```

          ## Features:
          - Built with Leptonica ${{ env.LEPTONICA_VERSION }}
          - Includes support for multiple image formats (PNG, TIFF, JPEG, WebP)
          - Full Unicode support via libicu
          - Optimized for performance with parallel processing

          ## Build Configuration:
          - RHEL 8 compatible build: AlmaLinux 8 (GCC 8+)
          - Amazon Linux 2 build: Amazon Linux 2 (GCC 7+)
          - Amazon Linux 2023 build: Amazon Linux 2023 (GCC 11+)
          - Build type: Release with optimizations
          - Install prefix: /usr/local

          This package is also available on OpenSUSE Build Service:
          https://build.opensuse.org/package/show/home:chethanuk/tesseract5
          RELEASE_NOTES_EOF
          
          # Create release
          echo "Creating release $TAG_NAME and uploading assets..."
          gh release create "$TAG_NAME" \
            --title "Tesseract OCR ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }}" \
            --notes-file release_notes.md \
            "${RPM_FILE_PATH}" \
            "${SPEC_FILE_PATH}" \
            "${AL2_RPM_FILE_PATH}" \
            "${AL2_SPEC_FILE_PATH}" \
            "${AL2023_RPM_FILE_PATH}" \
            "${AL2023_SPEC_FILE_PATH}"
          
          echo "GitHub Release created and assets uploaded."
