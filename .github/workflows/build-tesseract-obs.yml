name: Build Tesseract OCR RPM and Publish to OBS

on:
  push:
    branches:
      - main
      - feat/obs-publish-workflow
    paths:
      - '.github/workflows/build-tesseract-obs.yml'
  workflow_dispatch:

env:
  LEPTONICA_VERSION: "1.85.0"
  TESSERACT_VERSION: "5.3.1"
  SPEC_FILENAME: "tesseract-ocr-custom.spec"

jobs:
  build_and_package_tesseract:
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update dnf and install basic dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf -y config-manager --set-enabled powertools || echo "Attempted to enable PowerTools repo, proceeding..."
          dnf -y install epel-release
          dnf -y groupinstall 'Development Tools'
          dnf -y install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            wget \
            cmake \
            gcc-c++ \
            libpng-devel \
            libtiff-devel \
            zlib-devel \
            libwebp-devel \
            libjpeg-turbo-devel \
            libicu-devel \
            pango-devel \
            cairo-devel \
            rpm-build \
            autoconf-archive \
            patch

      - name: Build Leptonica
        run: |
          echo "Building Leptonica ${{ env.LEPTONICA_VERSION }}"
          cd /tmp
          wget -O leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz https://github.com/DanBloomberg/leptonica/archive/refs/tags/${{ env.LEPTONICA_VERSION }}.tar.gz
          tar -xzf leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz
          cd leptonica-${{ env.LEPTONICA_VERSION }}
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Tesseract OCR
        run: |
          echo "Building Tesseract OCR ${{ env.TESSERACT_VERSION }}"
          cd /tmp
          git clone https://github.com/tesseract-ocr/tesseract.git tesseract-ocr
          cd tesseract-ocr
          git checkout ${{ env.TESSERACT_VERSION }}
          ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig
          tesseract --version

      - name: Prepare RPM build environment and Spec File
        id: prepare_rpm_spec
        run: |
          echo "Creating RPM build directories and ${{ env.SPEC_FILENAME }} file"
          mkdir -p ${HOME}/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          SPEC_FILE_PATH="${HOME}/rpmbuild/SPECS/${{ env.SPEC_FILENAME }}"
          
          # Generate changelog date in the correct format
          CHANGELOG_DATE=$(date +"%a %b %d %Y")

          cat << SPEC_EOF > "${SPEC_FILE_PATH}"
          Name:       tesseract-ocr-custom
          Version:    ${{ env.TESSERACT_VERSION }}
          Release:    1.el8.leptonica${{ env.LEPTONICA_VERSION }}
          Summary:    Tesseract OCR Engine (${{ env.TESSERACT_VERSION }}) with Leptonica (${{ env.LEPTONICA_VERSION }})
          License:    Apache-2.0
          URL:        https://github.com/tesseract-ocr/tesseract

          Requires:   libicu
          Requires:   libpng 
          Requires:   libtiff 
          Requires:   zlib 
          Requires:   libwebp
          Requires:   libjpeg-turbo

          %global install_prefix /usr/local

          %description
          Custom build of Tesseract OCR Engine version ${{ env.TESSERACT_VERSION }}
          This package includes a custom build of Leptonica version ${{ env.LEPTONICA_VERSION }}.
          Files are installed in %{install_prefix}.
          Built on AlmaLinux 8 for RHEL 8 compatibility.

          %install
          mkdir -p %{buildroot}%{install_prefix}/bin
          mkdir -p %{buildroot}%{install_prefix}/lib/pkgconfig
          mkdir -p %{buildroot}%{install_prefix}/lib
          mkdir -p %{buildroot}%{install_prefix}/include/tesseract
          mkdir -p %{buildroot}%{install_prefix}/include/leptonica
          mkdir -p %{buildroot}%{install_prefix}/share/tessdata
          mkdir -p %{buildroot}%{install_prefix}/share/man/man1

          cp -a %{install_prefix}/bin/tesseract %{buildroot}%{install_prefix}/bin/
          
          # Copy all library files and symlinks
          cp -a %{install_prefix}/lib/* %{buildroot}%{install_prefix}/lib/
          
          cp -a %{install_prefix}/lib/pkgconfig/tesseract.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          cp -a %{install_prefix}/lib/pkgconfig/lept.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          
          # Copy contents of include directories
          cp -a %{install_prefix}/include/tesseract/* %{buildroot}%{install_prefix}/include/tesseract/
          cp -a %{install_prefix}/include/leptonica/* %{buildroot}%{install_prefix}/include/leptonica/
          
          if [ -d "%{install_prefix}/share/tessdata" ]; then
            find %{install_prefix}/share/tessdata -maxdepth 1 -type f \( -name "*.configs" -o -name "*.config" -o -name "pdf.ttf" \) -exec cp -a {} %{buildroot}%{install_prefix}/share/tessdata/ \;
            [ -f "%{install_prefix}/share/tessdata/osd.traineddata" ] && cp -a %{install_prefix}/share/tessdata/osd.traineddata %{buildroot}%{install_prefix}/share/tessdata/
            [ -f "%{install_prefix}/share/tessdata/eng.traineddata" ] && cp -a %{install_prefix}/share/tessdata/eng.traineddata %{buildroot}%{install_prefix}/share/tessdata/
          fi
          
          [ -f "%{install_prefix}/share/man/man1/tesseract.1" ] && cp -a %{install_prefix}/share/man/man1/tesseract.1 %{buildroot}%{install_prefix}/share/man/man1/
          # Ensure man page exists for RPM packaging (create empty file if missing)
          if [ ! -f "%{buildroot}%{install_prefix}/share/man/man1/tesseract.1" ]; then
            touch %{buildroot}%{install_prefix}/share/man/man1/tesseract.1
          fi

          %files
          %{install_prefix}/bin/tesseract
          %{install_prefix}/lib/*
          %{install_prefix}/lib/pkgconfig/tesseract.pc
          %{install_prefix}/lib/pkgconfig/lept.pc
          %dir %{install_prefix}/include/tesseract
          %{install_prefix}/include/tesseract/*
          %dir %{install_prefix}/include/leptonica
          %{install_prefix}/include/leptonica/*
          %dir %{install_prefix}/share/tessdata
          %{install_prefix}/share/tessdata/*
          %dir %{install_prefix}/share/man/man1
          %{install_prefix}/share/man/man1/tesseract.1

          %post -p /sbin/ldconfig
          %postun -p /sbin/ldconfig

          %changelog
          * ${CHANGELOG_DATE} GitHub Actions <actions@github.com> - ${{ env.TESSERACT_VERSION }}-1.el8.leptonica${{ env.LEPTONICA_VERSION }}
          - Automated build of Tesseract OCR ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }} via GitHub Actions on AlmaLinux 8.
          SPEC_EOF
          echo "SPEC_FILE_PATH=${SPEC_FILE_PATH}" >> $GITHUB_OUTPUT

      - name: Build RPM
        run: |
          rpmbuild -bb ${HOME}/rpmbuild/SPECS/${{ env.SPEC_FILENAME }} --define "_sourcedir /tmp" --define "_topdir ${HOME}/rpmbuild"
          echo "RPMs created:"
          find ${HOME}/rpmbuild/RPMS -name "*.rpm" -print

      - name: Upload RPM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-rpm
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      - name: Upload Spec File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-spec-rhel8
          path: ~/rpmbuild/SPECS/${{ env.SPEC_FILENAME }}
          if-no-files-found: error

  build_for_amazon_linux_2023:
    runs-on: ubuntu-latest
    container:
      image: amazonlinux:2023
      options: --privileged

    steps:
      - name: Install tar and gzip for actions/checkout
        run: |
          dnf -y install tar gzip

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update dnf and install basic dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf -y groupinstall 'Development Tools'
          dnf -y install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            wget \
            cmake \
            gcc-c++ \
            libpng-devel \
            libtiff-devel \
            zlib-devel \
            libwebp-devel \
            libjpeg-turbo-devel \
            libicu-devel \
            pango-devel \
            cairo-devel \
            rpm-build \
            autoconf-archive \
            patch

      - name: Build Leptonica
        run: |
          echo "Building Leptonica ${{ env.LEPTONICA_VERSION }}"
          cd /tmp
          wget -O leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz https://github.com/DanBloomberg/leptonica/archive/refs/tags/${{ env.LEPTONICA_VERSION }}.tar.gz
          tar -xzf leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz
          cd leptonica-${{ env.LEPTONICA_VERSION }}
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Tesseract OCR
        run: |
          echo "Building Tesseract OCR ${{ env.TESSERACT_VERSION }}"
          cd /tmp
          git clone https://github.com/tesseract-ocr/tesseract.git tesseract-ocr
          cd tesseract-ocr
          git checkout ${{ env.TESSERACT_VERSION }}
          ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig
          tesseract --version

      - name: Prepare RPM build environment and Spec File for AL2023
        id: prepare_rpm_spec_al2023
        run: |
          echo "Creating RPM build directories and AL2023 spec file"
          mkdir -p ${HOME}/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          SPEC_FILE_PATH="${HOME}/rpmbuild/SPECS/tesseract-ocr-al2023.spec"
          
          # Generate changelog date in the correct format
          CHANGELOG_DATE=$(date +"%a %b %d %Y")

          cat << SPEC_EOF > "${SPEC_FILE_PATH}"
          Name:       tesseract-ocr-custom
          Version:    ${{ env.TESSERACT_VERSION }}
          Release:    1.amzn2023.leptonica${{ env.LEPTONICA_VERSION }}
          Summary:    Tesseract OCR Engine (${{ env.TESSERACT_VERSION }}) with Leptonica (${{ env.LEPTONICA_VERSION }})
          License:    Apache-2.0
          URL:        https://github.com/tesseract-ocr/tesseract

          Requires:   libicu
          Requires:   libpng 
          Requires:   libtiff 
          Requires:   zlib 
          Requires:   libwebp
          Requires:   libjpeg-turbo

          %global install_prefix /usr/local

          %description
          Custom build of Tesseract OCR Engine version ${{ env.TESSERACT_VERSION }}
          This package includes a custom build of Leptonica version ${{ env.LEPTONICA_VERSION }}.
          Files are installed in %{install_prefix}.
          Built on Amazon Linux 2023 (Fedora-based) for modern compatibility.

          %install
          mkdir -p %{buildroot}%{install_prefix}/bin
          mkdir -p %{buildroot}%{install_prefix}/lib/pkgconfig
          mkdir -p %{buildroot}%{install_prefix}/lib
          mkdir -p %{buildroot}%{install_prefix}/include/tesseract
          mkdir -p %{buildroot}%{install_prefix}/include/leptonica
          mkdir -p %{buildroot}%{install_prefix}/share/tessdata
          mkdir -p %{buildroot}%{install_prefix}/share/man/man1

          cp -a %{install_prefix}/bin/tesseract %{buildroot}%{install_prefix}/bin/
          
          # Copy all library files and symlinks
          cp -a %{install_prefix}/lib/* %{buildroot}%{install_prefix}/lib/
          
          cp -a %{install_prefix}/lib/pkgconfig/tesseract.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          cp -a %{install_prefix}/lib/pkgconfig/lept.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          
          # Copy contents of include directories
          cp -a %{install_prefix}/include/tesseract/* %{buildroot}%{install_prefix}/include/tesseract/
          cp -a %{install_prefix}/include/leptonica/* %{buildroot}%{install_prefix}/include/leptonica/
          
          if [ -d "%{install_prefix}/share/tessdata" ]; then
            find %{install_prefix}/share/tessdata -maxdepth 1 -type f \( -name "*.configs" -o -name "*.config" -o -name "pdf.ttf" \) -exec cp -a {} %{buildroot}%{install_prefix}/share/tessdata/ \;
            [ -f "%{install_prefix}/share/tessdata/osd.traineddata" ] && cp -a %{install_prefix}/share/tessdata/osd.traineddata %{buildroot}%{install_prefix}/share/tessdata/
            [ -f "%{install_prefix}/share/tessdata/eng.traineddata" ] && cp -a %{install_prefix}/share/tessdata/eng.traineddata %{buildroot}%{install_prefix}/share/tessdata/
          fi
          
          [ -f "%{install_prefix}/share/man/man1/tesseract.1" ] && cp -a %{install_prefix}/share/man/man1/tesseract.1 %{buildroot}%{install_prefix}/share/man/man1/
          # Ensure man page exists for RPM packaging (create empty file if missing)
          if [ ! -f "%{buildroot}%{install_prefix}/share/man/man1/tesseract.1" ]; then
            touch %{buildroot}%{install_prefix}/share/man/man1/tesseract.1
          fi

          %files
          %{install_prefix}/bin/tesseract
          %{install_prefix}/lib/*
          %{install_prefix}/lib/pkgconfig/tesseract.pc
          %{install_prefix}/lib/pkgconfig/lept.pc
          %dir %{install_prefix}/include/tesseract
          %{install_prefix}/include/tesseract/*
          %dir %{install_prefix}/include/leptonica
          %{install_prefix}/include/leptonica/*
          %dir %{install_prefix}/share/tessdata
          %{install_prefix}/share/tessdata/*
          %dir %{install_prefix}/share/man/man1
          %{install_prefix}/share/man/man1/tesseract.1

          %post -p /sbin/ldconfig
          %postun -p /sbin/ldconfig

          %changelog
          * ${CHANGELOG_DATE} GitHub Actions <actions@github.com> - ${{ env.TESSERACT_VERSION }}-1.amzn2023.leptonica${{ env.LEPTONICA_VERSION }}
          - Automated build of Tesseract OCR ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }} via GitHub Actions on Amazon Linux 2023.
          SPEC_EOF
          echo "SPEC_FILE_PATH=${SPEC_FILE_PATH}" >> $GITHUB_OUTPUT

      - name: Build RPM for Amazon Linux 2023
        run: |
          rpmbuild -bb ${HOME}/rpmbuild/SPECS/tesseract-ocr-al2023.spec --define "_sourcedir /tmp" --define "_topdir ${HOME}/rpmbuild"
          echo "Amazon Linux 2023 RPMs created:"
          find ${HOME}/rpmbuild/RPMS -name "*.rpm" -print

      - name: Upload Amazon Linux 2023 RPM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2023
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      - name: Upload Amazon Linux 2023 Spec File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-spec-al2023
          path: ~/rpmbuild/SPECS/tesseract-ocr-al2023.spec
          if-no-files-found: error

  publish_to_obs:
    needs: [build_and_package_tesseract, build_for_amazon_linux_2023]
    runs-on: ubuntu-latest
    
    steps:
      - name: Install OBS CLI (osc)
        run: |
          # Install pip if not available
          sudo apt-get update
          sudo apt-get install -y python3-pip
          
          # Install latest osc from PyPI to avoid imp module issues with Python 3.12
          pip3 install --user osc
          
          # Add pip user bin to PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm
          path: /tmp/tesseract-rpm-artifact

      - name: Download AlmaLinux 8 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-rhel8
          path: /tmp/tesseract-spec-artifact-rhel8

      - name: Download Amazon Linux 2023 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2023
          path: /tmp/tesseract-rpm-artifact-al2023

      - name: Download Amazon Linux 2023 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-al2023
          path: /tmp/tesseract-spec-artifact-al2023

      - name: List downloaded artifacts
        run: |
          echo "Downloaded RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact
          echo "Spec artifact contents for RHEL8:"
          ls -R /tmp/tesseract-spec-artifact-rhel8
          echo "Amazon Linux 2023 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2023
          echo "Amazon Linux 2023 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2023

      - name: Configure OBS credentials
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          echo "Configuring OBS access..."
          if [ -z "$OBS_TOKEN" ]; then
            echo "Error: OBS_TOKEN secret is not set. Cannot proceed with OBS publishing."
            exit 1
          fi
          
          # Create oscrc in the correct location
          mkdir -p ~/.config/osc
          cat << 'OBS_CONFIG_EOF' > ~/.config/osc/oscrc
          [general]
          apiurl = https://api.opensuse.org
          
          [https://api.opensuse.org]
          user = chethanuk
          pass = ${{ secrets.OBS_TOKEN }}
          OBS_CONFIG_EOF
          chmod 600 ~/.config/osc/oscrc
          echo "OBS credentials configured."

      - name: Publish to OBS
        env:
          OBS_PROJECT: "home:chethanuk"
          OBS_PACKAGE: "tesseract5"
          SPEC_FILENAME_ENV: ${{ env.SPEC_FILENAME }}
        run: |
          echo "Publishing RPM to OBS project ${OBS_PROJECT}/${OBS_PACKAGE}"
          cd /tmp
          
          # Test authentication first
          echo "Testing OBS authentication..."
          if ! osc ls "${OBS_PROJECT}" > /dev/null 2>&1; then
            echo "Error: Authentication failed. Please check OBS_TOKEN secret."
            exit 1
          fi
          echo "Authentication successful."
          
          # Check if package exists, create if not
          if ! osc ls "${OBS_PROJECT}" | grep -q "^${OBS_PACKAGE}$"; then
            echo "Package ${OBS_PACKAGE} does not exist in project ${OBS_PROJECT}. Creating..."
            # Create package with description
            osc meta pkg "${OBS_PROJECT}" "${OBS_PACKAGE}" -F - << 'PKG_META_EOF'
          <package name="tesseract5" project="home:chethanuk">
            <title>Tesseract OCR 5</title>
            <description>Custom build of Tesseract OCR Engine with Leptonica</description>
          </package>
          PKG_META_EOF
          else
            echo "Package ${OBS_PACKAGE} already exists in project ${OBS_PROJECT}."
          fi
          
          osc checkout "${OBS_PROJECT}/${OBS_PACKAGE}"
          
          if [ ! -d "${OBS_PROJECT}/${OBS_PACKAGE}" ]; then
            echo "Error: OBS checkout failed. Directory ${OBS_PROJECT}/${OBS_PACKAGE} not found."
            exit 1
          fi
          cd "${OBS_PROJECT}/${OBS_PACKAGE}"
          
          # Remove old files
          rm -f *.rpm
          rm -f *.spec
          
          # Copy new RPM
          RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact -name "*.rpm" -type f -print -quit)
          if [ -z "$RPM_FILE_PATH" ]; then
            echo "Error: RPM file not found in /tmp/tesseract-rpm-artifact."
            exit 1
          fi
          SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-rhel8 -name "*.spec" -type f -print -quit)
          if [ -z "$SPEC_FILE_PATH" ]; then
            echo "Error: Spec file not found in /tmp/tesseract-spec-artifact-rhel8."
            exit 1
          fi
          
          # Find Amazon Linux 2023 files
          AL2023_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2023 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2023_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 RPM file not found."
            exit 1
          fi
          AL2023_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2023 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2023_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 Spec file not found."
            exit 1
          fi
          
          # Copy new RPM
          cp "$RPM_FILE_PATH" .
          echo "Copied RPM: $(basename "$RPM_FILE_PATH")"
          
          # Copy spec file
          cp "$SPEC_FILE_PATH" .
          echo "Copied spec file: $(basename "$SPEC_FILE_PATH")"
          
          # Copy Amazon Linux 2023 RPM
          cp "$AL2023_RPM_FILE_PATH" .
          echo "Copied Amazon Linux 2023 RPM: $(basename "$AL2023_RPM_FILE_PATH")"
          
          # Copy Amazon Linux 2023 spec file
          cp "$AL2023_SPEC_FILE_PATH" .
          echo "Copied Amazon Linux 2023 spec file: $(basename "$AL2023_SPEC_FILE_PATH")"
          
          # Add new files to OBS
          echo "Adding new files to OBS..."
          osc addremove
          
          # Check status
          echo "OBS status:"
          osc status
          
          # Commit changes
          if osc status | grep -q 'nothing to commit'; then
            echo "OBS: No changes to commit."
          else
            osc commit -m "Update Tesseract OCR to ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }} from GitHub Actions"
            echo "OBS commit successful."
          fi

  publish_to_github_release:
    needs: [build_and_package_tesseract, build_for_amazon_linux_2023]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm
          path: /tmp/tesseract-rpm-artifact

      - name: Download AlmaLinux 8 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-rhel8
          path: /tmp/tesseract-spec-artifact-rhel8

      - name: Download Amazon Linux 2023 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2023
          path: /tmp/tesseract-rpm-artifact-al2023

      - name: Download Amazon Linux 2023 Spec File artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-al2023
          path: /tmp/tesseract-spec-artifact-al2023

      - name: List downloaded artifacts for release
        run: |
          echo "RPM artifact contents for release:"
          ls -R /tmp/tesseract-rpm-artifact
          echo "Spec artifact contents for release:"
          ls -R /tmp/tesseract-spec-artifact-rhel8
          echo "Amazon Linux 2023 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2023
          echo "Amazon Linux 2023 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2023

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ env.TESSERACT_VERSION }}-leptonica${{ env.LEPTONICA_VERSION }}
        run: |
          # Find RHEL 8 compatible files
          RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact -name "*.rpm" -type f -print -quit)
          if [ -z "$RPM_FILE_PATH" ]; then
            echo "Error: RPM file not found in /tmp/tesseract-rpm-artifact."
            exit 1
          fi
          SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-rhel8 -name "*.spec" -type f -print -quit)
          if [ -z "$SPEC_FILE_PATH" ]; then
            echo "Error: Spec file not found in /tmp/tesseract-spec-artifact-rhel8."
            exit 1
          fi
          
          # Find Amazon Linux 2023 files
          AL2023_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2023 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2023_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 RPM file not found."
            exit 1
          fi
          AL2023_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2023 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2023_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 Spec file not found."
            exit 1
          fi
          
          # Create release notes file
          cat << 'RELEASE_NOTES_EOF' > release_notes.md
          Automated release of Tesseract OCR ${{ env.TESSERACT_VERSION }} (custom build with Leptonica ${{ env.LEPTONICA_VERSION }}). 

          ## What's included:
          - AlmaLinux 8 RPM package (RHEL 8 compatible)
          - Amazon Linux 2023 RPM package
          - RPM spec files for both builds

          ## Installation:
          
          ### For RHEL 8 / AlmaLinux 8 / Rocky Linux 8:
          ```bash
          sudo rpm -i tesseract-ocr-custom-*el8*.rpm
          ```
          
          ### For Amazon Linux 2023:
          ```bash
          sudo rpm -i tesseract-ocr-custom-*amzn2023*.rpm
          ```
          
          ### Verify installation:
          ```bash
          tesseract --version
          ```

          ## Features:
          - Built with Leptonica ${{ env.LEPTONICA_VERSION }}
          - Includes support for multiple image formats (PNG, TIFF, JPEG, WebP)
          - Full Unicode support via libicu
          - Optimized for performance with parallel processing

          ## Build Configuration:
          - RHEL 8 compatible build: AlmaLinux 8 (GCC 8+)
          - Amazon Linux 2023 build: Amazon Linux 2023 (GCC 11+)
          - Build type: Release with optimizations
          - Install prefix: /usr/local

          This package is also available on OpenSUSE Build Service:
          https://build.opensuse.org/package/show/home:chethanuk/tesseract5
          RELEASE_NOTES_EOF
          
          # Check if release exists
          echo "Checking if release $TAG_NAME exists..."
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Updating assets..."
            
            # Delete existing assets with the same names to avoid conflicts
            echo "Removing old assets if they exist..."
            for asset in "$(basename "$RPM_FILE_PATH")" "$(basename "$SPEC_FILE_PATH")" "$(basename "$AL2023_RPM_FILE_PATH")" "$(basename "$AL2023_SPEC_FILE_PATH")"; do
              if gh release view "$TAG_NAME" --json assets -q ".assets[] | select(.name == \"$asset\") | .name" | grep -q "$asset"; then
                echo "Deleting existing asset: $asset"
                gh release delete-asset "$TAG_NAME" "$asset" -y
              fi
            done
            
            # Upload new assets to existing release
            echo "Uploading new assets to existing release..."
            gh release upload "$TAG_NAME" \
              "${RPM_FILE_PATH}" \
              "${SPEC_FILE_PATH}" \
              "${AL2023_RPM_FILE_PATH}" \
              "${AL2023_SPEC_FILE_PATH}" \
              --clobber
            
            # Update release notes
            echo "Updating release notes..."
            gh release edit "$TAG_NAME" \
              --notes-file release_notes.md
            
            echo "GitHub Release updated with new assets."
          else
            # Create new release
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "Tesseract OCR ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }}" \
              --notes-file release_notes.md \
              "${RPM_FILE_PATH}" \
              "${SPEC_FILE_PATH}" \
              "${AL2023_RPM_FILE_PATH}" \
              "${AL2023_SPEC_FILE_PATH}"
            
            echo "GitHub Release created and assets uploaded."
          fi
