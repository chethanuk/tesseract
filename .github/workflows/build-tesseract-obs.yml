name: Build Tesseract OCR RPM and Publish to OBS

on:
  push:
    branches:
      - main
      - feat/obs-publish-workflow
    paths:
      - '.github/workflows/build-tesseract-obs.yml'
  workflow_dispatch:

env:
  LEPTONICA_VERSION: "1.82.0"
  TESSERACT_VERSION: "5.3.1"
  SPEC_FILENAME: "tesseract-ocr-custom.spec"

jobs:
  build_and_package_tesseract:
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update dnf and install basic dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf -y config-manager --set-enabled powertools || echo "Attempted to enable PowerTools repo, proceeding..."
          dnf -y install epel-release
          dnf -y groupinstall 'Development Tools'
          dnf -y install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            wget \
            cmake \
            gcc-c++ \
            libpng-devel \
            libtiff-devel \
            zlib-devel \
            libwebp-devel \
            libjpeg-turbo-devel \
            libicu-devel \
            pango-devel \
            cairo-devel \
            rpm-build \
            autoconf-archive \
            patch

      - name: Build Leptonica
        run: |
          echo "Building Leptonica ${{ env.LEPTONICA_VERSION }}"
          cd /tmp
          wget -O leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz https://github.com/DanBloomberg/leptonica/archive/refs/tags/${{ env.LEPTONICA_VERSION }}.tar.gz
          tar -xzf leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz
          cd leptonica-${{ env.LEPTONICA_VERSION }}
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Tesseract OCR
        run: |
          echo "Building Tesseract OCR ${{ env.TESSERACT_VERSION }}"
          cd /tmp
          git clone https://github.com/tesseract-ocr/tesseract.git tesseract-ocr
          cd tesseract-ocr
          git checkout ${{ env.TESSERACT_VERSION }}
          ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig
          tesseract --version

      - name: Prepare RPM build environment and Spec File
        id: prepare_rpm_spec
        run: |
          echo "Creating RPM build directories and ${{ env.SPEC_FILENAME }} file"
          mkdir -p ${HOME}/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          SPEC_FILE_PATH="${HOME}/rpmbuild/SPECS/${{ env.SPEC_FILENAME }}"
          
          # Generate changelog date in the correct format
          CHANGELOG_DATE=$(date +"%a %b %d %Y")

          cat << SPEC_EOF > "${SPEC_FILE_PATH}"
          Name:       tesseract-ocr-custom
          Version:    ${{ env.TESSERACT_VERSION }}
          Release:    1.el8.leptonica${{ env.LEPTONICA_VERSION }}
          Summary:    Tesseract OCR Engine (${{ env.TESSERACT_VERSION }}) with Leptonica (${{ env.LEPTONICA_VERSION }})
          License:    Apache-2.0
          URL:        https://github.com/tesseract-ocr/tesseract

          Requires:   libicu
          Requires:   libpng 
          Requires:   libtiff 
          Requires:   zlib 
          Requires:   libwebp
          Requires:   libjpeg-turbo

          %global install_prefix /usr/local

          %description
          Custom build of Tesseract OCR Engine version ${{ env.TESSERACT_VERSION }}
          This package includes a custom build of Leptonica version ${{ env.LEPTONICA_VERSION }}.
          Files are installed in %{install_prefix}.
          Built on AlmaLinux 8 for RHEL 8 compatibility.

          %install
          mkdir -p %{buildroot}%{install_prefix}/bin
          mkdir -p %{buildroot}%{install_prefix}/lib/pkgconfig
          mkdir -p %{buildroot}%{install_prefix}/lib
          mkdir -p %{buildroot}%{install_prefix}/include/tesseract
          mkdir -p %{buildroot}%{install_prefix}/include/leptonica
          mkdir -p %{buildroot}%{install_prefix}/share/tessdata
          mkdir -p %{buildroot}%{install_prefix}/share/man/man1

          cp -a %{install_prefix}/bin/tesseract %{buildroot}%{install_prefix}/bin/
          
          # Copy all library files and symlinks
          cp -a %{install_prefix}/lib/* %{buildroot}%{install_prefix}/lib/
          
          cp -a %{install_prefix}/lib/pkgconfig/tesseract.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          cp -a %{install_prefix}/lib/pkgconfig/lept.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          
          # Copy contents of include directories
          cp -a %{install_prefix}/include/tesseract/* %{buildroot}%{install_prefix}/include/tesseract/
          cp -a %{install_prefix}/include/leptonica/* %{buildroot}%{install_prefix}/include/leptonica/
          
          if [ -d "%{install_prefix}/share/tessdata" ]; then
            find %{install_prefix}/share/tessdata -maxdepth 1 -type f \( -name "*.configs" -o -name "*.config" -o -name "pdf.ttf" \) -exec cp -a {} %{buildroot}%{install_prefix}/share/tessdata/ \;
            [ -f "%{install_prefix}/share/tessdata/osd.traineddata" ] && cp -a %{install_prefix}/share/tessdata/osd.traineddata %{buildroot}%{install_prefix}/share/tessdata/
            [ -f "%{install_prefix}/share/tessdata/eng.traineddata" ] && cp -a %{install_prefix}/share/tessdata/eng.traineddata %{buildroot}%{install_prefix}/share/tessdata/
          fi
          
          [ -f "%{install_prefix}/share/man/man1/tesseract.1" ] && cp -a %{install_prefix}/share/man/man1/tesseract.1 %{buildroot}%{install_prefix}/share/man/man1/
          # Ensure man page exists for RPM packaging (create empty file if missing)
          if [ ! -f "%{buildroot}%{install_prefix}/share/man/man1/tesseract.1" ]; then
            touch %{buildroot}%{install_prefix}/share/man/man1/tesseract.1
          fi

          %files
          %{install_prefix}/bin/tesseract
          %{install_prefix}/lib/*
          %{install_prefix}/lib/pkgconfig/tesseract.pc
          %{install_prefix}/lib/pkgconfig/lept.pc
          %dir %{install_prefix}/include/tesseract
          %{install_prefix}/include/tesseract/*
          %dir %{install_prefix}/include/leptonica
          %{install_prefix}/include/leptonica/*
          %dir %{install_prefix}/share/tessdata
          %{install_prefix}/share/tessdata/*
          %dir %{install_prefix}/share/man/man1
          %{install_prefix}/share/man/man1/tesseract.1

          %post -p /sbin/ldconfig
          %postun -p /sbin/ldconfig

          %changelog
          * ${CHANGELOG_DATE} GitHub Actions <actions@github.com> - ${{ env.TESSERACT_VERSION }}-1.el8.leptonica${{ env.LEPTONICA_VERSION }}
          - Automated build of Tesseract OCR ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }} via GitHub Actions on AlmaLinux 8.
          SPEC_EOF
          echo "SPEC_FILE_PATH=${SPEC_FILE_PATH}" >> $GITHUB_OUTPUT

      - name: Build RPM
        run: |
          rpmbuild -bb ${HOME}/rpmbuild/SPECS/${{ env.SPEC_FILENAME }} --define "_sourcedir /tmp" --define "_topdir ${HOME}/rpmbuild"
          echo "RPMs created:"
          find ${HOME}/rpmbuild/RPMS -name "*.rpm" -print

      - name: Upload RPM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-rpm
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      - name: Upload Spec File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-spec-rhel8
          path: ~/rpmbuild/SPECS/${{ env.SPEC_FILENAME }}
          if-no-files-found: error

  build_for_amazon_linux:
    runs-on: ubuntu-latest
    container:
      image: amazonlinux:2
      options: --privileged

    steps:
      # Manual checkout since actions/checkout@v4 requires newer glibc than Amazon Linux 2 provides
      - name: Install git
        run: |
          yum -y install git

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory /__w/tesseract/tesseract

      - name: Manual checkout
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: Update yum and install basic dependencies
        run: |
          yum -y update
          yum -y install amazon-linux-extras
          amazon-linux-extras enable epel
          yum -y install epel-release
          yum -y groupinstall 'Development Tools'
          yum -y install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            wget \
            cmake \
            gcc-c++ \
            libpng-devel \
            libtiff-devel \
            zlib-devel \
            libjpeg-turbo-devel \
            libicu-devel \
            pango-devel \
            cairo-devel \
            rpm-build \
            autoconf-archive \
            patch

      - name: Install libwebp from source (not available in AL2 repos)
        run: |
          cd /tmp
          wget https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.2.4.tar.gz
          tar -xzf libwebp-1.2.4.tar.gz
          cd libwebp-1.2.4
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Leptonica
        run: |
          echo "Building Leptonica ${{ env.LEPTONICA_VERSION }}"
          cd /tmp
          wget -O leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz https://github.com/DanBloomberg/leptonica/archive/refs/tags/${{ env.LEPTONICA_VERSION }}.tar.gz
          tar -xzf leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz
          cd leptonica-${{ env.LEPTONICA_VERSION }}
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Tesseract OCR
        run: |
          echo "Building Tesseract OCR ${{ env.TESSERACT_VERSION }}"
          cd /tmp
          git clone https://github.com/tesseract-ocr/tesseract.git tesseract-ocr
          cd tesseract-ocr
          git checkout ${{ env.TESSERACT_VERSION }}
          ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig
          tesseract --version

      - name: Prepare RPM build environment and Spec File for AL2
        id: prepare_rpm_spec_al2
        run: |
          echo "Creating RPM build directories and AL2 spec file"
          mkdir -p ${HOME}/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          SPEC_FILE_PATH="${HOME}/rpmbuild/SPECS/tesseract-ocr-al2.spec"
          
          # Generate changelog date in the correct format
          CHANGELOG_DATE=$(date +"%a %b %d %Y")

          cat << SPEC_EOF > "${SPEC_FILE_PATH}"
          Name:       tesseract-ocr-custom
          Version:    ${{ env.TESSERACT_VERSION }}
          Release:    1.amzn2.leptonica${{ env.LEPTONICA_VERSION }}
          Summary:    Tesseract OCR Engine (${{ env.TESSERACT_VERSION }}) with Leptonica (${{ env.LEPTONICA_VERSION }})
          License:    Apache-2.0
          URL:        https://github.com/tesseract-ocr/tesseract

          Requires:   libicu
          Requires:   libpng 
          Requires:   libtiff 
          Requires:   zlib 
          Requires:   libjpeg-turbo

          %global install_prefix /usr/local

          %description
          Custom build of Tesseract OCR Engine version ${{ env.TESSERACT_VERSION }}
          This package includes a custom build of Leptonica version ${{ env.LEPTONICA_VERSION }}.
          Files are installed in %{install_prefix}.
          Built on Amazon Linux 2 for maximum compatibility.

          %install
          mkdir -p %{buildroot}%{install_prefix}/bin
          mkdir -p %{buildroot}%{install_prefix}/lib/pkgconfig
          mkdir -p %{buildroot}%{install_prefix}/lib
          mkdir -p %{buildroot}%{install_prefix}/include/tesseract
          mkdir -p %{buildroot}%{install_prefix}/include/leptonica
          mkdir -p %{buildroot}%{install_prefix}/share/tessdata
          mkdir -p %{buildroot}%{install_prefix}/share/man/man1

          cp -a %{install_prefix}/bin/tesseract %{buildroot}%{install_prefix}/bin/
          
          # Copy all library files and symlinks
          cp -a %{install_prefix}/lib/* %{buildroot}%{install_prefix}/lib/
          
          cp -a %{install_prefix}/lib/pkgconfig/tesseract.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          cp -a %{install_prefix}/lib/pkgconfig/lept.pc %{buildroot}%{install_prefix}/lib/pkgconfig/
          
          # Copy contents of include directories
          cp -a %{install_prefix}/include/tesseract/* %{buildroot}%{install_prefix}/include/tesseract/
          cp -a %{install_prefix}/include/leptonica/* %{buildroot}%{install_prefix}/include/leptonica/
          
          if [ -d "%{install_prefix}/share/tessdata" ]; then
            find %{install_prefix}/share/tessdata -maxdepth 1 -type f \( -name "*.configs" -o -name "*.config" -o -name "pdf.ttf" \) -exec cp -a {} %{buildroot}%{install_prefix}/share/tessdata/ \;
            [ -f "%{install_prefix}/share/tessdata/osd.traineddata" ] && cp -a %{install_prefix}/share/tessdata/osd.traineddata %{buildroot}%{install_prefix}/share/tessdata/
            [ -f "%{install_prefix}/share/tessdata/eng.traineddata" ] && cp -a %{install_prefix}/share/tessdata/eng.traineddata %{buildroot}%{install_prefix}/share/tessdata/
          fi
          
          [ -f "%{install_prefix}/share/man/man1/tesseract.1" ] && cp -a %{install_prefix}/share/man/man1/tesseract.1 %{buildroot}%{install_prefix}/share/man/man1/
          # Ensure man page exists for RPM packaging (create empty file if missing)
          if [ ! -f "%{buildroot}%{install_prefix}/share/man/man1/tesseract.1" ]; then
            touch %{buildroot}%{install_prefix}/share/man/man1/tesseract.1
          fi

          %files
          %{install_prefix}/bin/tesseract
          %{install_prefix}/lib/*
          %{install_prefix}/lib/pkgconfig/tesseract.pc
          %{install_prefix}/lib/pkgconfig/lept.pc
          %dir %{install_prefix}/include/tesseract
          %{install_prefix}/include/tesseract/*
          %dir %{install_prefix}/include/leptonica
          %{install_prefix}/include/leptonica/*
          %dir %{install_prefix}/share/tessdata
          %{install_prefix}/share/tessdata/*
          %dir %{install_prefix}/share/man/man1
          %{install_prefix}/share/man/man1/tesseract.1

          %post -p /sbin/ldconfig
          %postun -p /sbin/ldconfig

          %changelog
          * ${CHANGELOG_DATE} GitHub Actions <actions@github.com> - ${{ env.TESSERACT_VERSION }}-1.amzn2.leptonica${{ env.LEPTONICA_VERSION }}
          - Automated build of Tesseract OCR ${{ env.TESSERACT_VERSION }} with Leptonica ${{ env.LEPTONICA_VERSION }} via GitHub Actions on Amazon Linux 2.
          SPEC_EOF
          echo "SPEC_FILE_PATH=${SPEC_FILE_PATH}" >> $GITHUB_OUTPUT

      - name: Build RPM for Amazon Linux 2
        run: |
          rpmbuild -bb ${HOME}/rpmbuild/SPECS/tesseract-ocr-al2.spec --define "_sourcedir /tmp" --define "_topdir ${HOME}/rpmbuild"
          echo "Amazon Linux 2 RPMs created:"
          find ${HOME}/rpmbuild/RPMS -name "*.rpm" -print

      - name: Copy Amazon Linux 2 artifacts to workspace
        run: |
          # The workspace is mounted at /__w/tesseract/tesseract
          mkdir -p /__w/tesseract/tesseract/amazon-linux-artifacts/rpm
          mkdir -p /__w/tesseract/tesseract/amazon-linux-artifacts/spec
          cp ${HOME}/rpmbuild/RPMS/*/*.rpm /__w/tesseract/tesseract/amazon-linux-artifacts/rpm/
          cp ${HOME}/rpmbuild/SPECS/tesseract-ocr-al2.spec /__w/tesseract/tesseract/amazon-linux-artifacts/spec/
          echo "Artifacts copied to workspace"
          ls -la /__w/tesseract/tesseract/amazon-linux-artifacts/rpm/
          ls -la /__w/tesseract/tesseract/amazon-linux-artifacts/spec/

      - name: Upload Amazon Linux 2 RPM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-rpm-al2
          path: amazon-linux-artifacts/rpm/*.rpm
          if-no-files-found: error

      - name: Upload Amazon Linux 2 Spec File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-spec-al2
          path: amazon-linux-artifacts/spec/tesseract-ocr-al2.spec
          if-no-files-found: error

  build_for_amazon_linux_2023:
    runs-on: ubuntu-latest
    container:
      image: amazonlinux:2023
      options: --privileged

    steps:
      - name: Install tar and gzip for actions/checkout
        run: |
          dnf -y install tar gzip

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update dnf and install basic dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf -y groupinstall 'Development Tools'
          dnf -y install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            wget \
            cmake \
            gcc-c++ \
            libpng-devel \
            libtiff-devel \
            zlib-devel \
            libwebp-devel \
            libjpeg-turbo-devel \
            libicu-devel \
            pango-devel \
            cairo-devel \
            rpm-build \
            autoconf-archive \
            patch

      - name: Build Leptonica
        run: |
          echo "Building Leptonica ${{ env.LEPTONICA_VERSION }}"
          cd /tmp
          wget -O leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz https://github.com/DanBloomberg/leptonica/archive/refs/tags/${{ env.LEPTONICA_VERSION }}.tar.gz
          tar -xzf leptonica-${{ env.LEPTONICA_VERSION }}.tar.gz
          cd leptonica-${{ env.LEPTONICA_VERSION }}
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
