name: Build Tesseract OCR RPM and Publish to OBS

on:
  push:
    branches:
      - main
      - feat/obs-publish-workflow
    paths:
      - '.github/workflows/build-tesseract-obs.yml'
  workflow_dispatch:

jobs:
  setup_gpg_key:
    name: Setup GPG Signing Key
    runs-on: ubuntu-latest
    outputs:
      gpg_key_fingerprint: ${{ steps.gpg_setup.outputs.fingerprint }}
    
    steps:
      - name: Create GPG signing key
        id: gpg_setup
        run: |
          # Generate GPG key for package signing
          cat >gpg_batch <<EOF
          %echo Generating GPG key for RPM signing
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: Tesseract OCR Build Bot
          Name-Email: tesseract-build@github.com
          Expire-Date: 1y
          %no-protection
          %commit
          %echo done
          EOF
          
          gpg --batch --generate-key gpg_batch
          
          # Export the key
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr:' | head -1 | cut -d: -f10)
          echo "fingerprint=$GPG_FINGERPRINT" >> $GITHUB_OUTPUT
          
          # Export public key for distribution
          gpg --armor --export "Tesseract OCR Build Bot" > tesseract-ocr-gpg-key.asc
          
          # Export private key for signing (would be stored as secret in production)
          gpg --armor --export-secret-keys "Tesseract OCR Build Bot" > tesseract-ocr-gpg-private.asc
          
      - name: Upload GPG public key
        uses: actions/upload-artifact@v4
        with:
          name: gpg-public-key
          path: tesseract-ocr-gpg-key.asc
          retention-days: 30

  build_and_package_tesseract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tesseract_version: ["5.3.1"] # "5.3.4", "5.4.1", "5.5.1"
        leptonica_version: ["1.85.0"]  # "1.82.0", 
    container:
      image: almalinux:8
      options: --privileged
    needs: setup_gpg_key
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update dnf and install basic dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf -y config-manager --set-enabled powertools || echo "Attempted to enable PowerTools repo, proceeding..."
          dnf -y install epel-release
          dnf -y groupinstall 'Development Tools'
          dnf -y install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            wget \
            cmake \
            gcc-c++ \
            libpng-devel \
            libtiff-devel \
            zlib-devel \
            libwebp-devel \
            libjpeg-turbo-devel \
            libicu-devel \
            pango-devel \
            cairo-devel \
            rpm-build \
            autoconf-archive \
            patch \
            giflib-devel \
            libarchive-devel \
            libcurl-devel \
            openjpeg2-devel

      - name: Build Leptonica
        run: |
          echo "Building Leptonica ${{ matrix.leptonica_version }}"
          cd /tmp
          wget -O leptonica-${{ matrix.leptonica_version }}.tar.gz https://github.com/DanBloomberg/leptonica/archive/refs/tags/${{ matrix.leptonica_version }}.tar.gz
          tar -xzf leptonica-${{ matrix.leptonica_version }}.tar.gz
          cd leptonica-${{ matrix.leptonica_version }}
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Tesseract OCR
        run: |
          echo "Building Tesseract OCR ${{ matrix.tesseract_version }}"
          cd /tmp
          git clone https://github.com/tesseract-ocr/tesseract.git tesseract-ocr
          cd tesseract-ocr
          git checkout ${{ matrix.tesseract_version }}
          ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig
          tesseract --version

      - name: Prepare RPM Spec File
        run: |
          # Create RPM build directories first
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          
          # Use spec template and substitute variables
          DATE=$(date +"%a %b %d %Y")
          sed -e "s/\${TESSERACT_VERSION}/${{ matrix.tesseract_version }}/g" \
              -e "s/\${LEPTONICA_VERSION}/${{ matrix.leptonica_version }}/g" \
              -e "s/\${DATE}/$DATE/g" \
              .github/workflows/spec-templates/almalinux8.spec.template > ~/rpmbuild/SPECS/tesseract.spec
              
          # Copy the spec file for later upload
          cp ~/rpmbuild/SPECS/tesseract.spec tesseract-ocr-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}.spec
          
          # Create source tarballs (empty, as we're building from the installed files)
          mkdir -p ~/rpmbuild/SOURCES
          touch ~/rpmbuild/SOURCES/tesseract-${{ matrix.tesseract_version }}.tar.gz
          touch ~/rpmbuild/SOURCES/leptonica-${{ matrix.leptonica_version }}.tar.gz

      - name: Build RPM
        run: |
          rpmbuild -bb ${HOME}/rpmbuild/SPECS/tesseract.spec --define "_sourcedir /tmp" --define "_topdir ${HOME}/rpmbuild"
          echo "RPMs created:"
          find ${HOME}/rpmbuild/RPMS -name "*.rpm" -print

      - name: Upload RPM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-rpm-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-el8
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      - name: Upload Spec File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-spec-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-rhel8
          path: ~/rpmbuild/SPECS/tesseract.spec
          if-no-files-found: error

  build_for_amazon_linux_2023:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tesseract_version: ["5.3.1"] # "5.3.4", "5.4.1", "5.5.1"
        leptonica_version: ["1.85.0"]  # "1.82.0", 
    container:
      image: amazonlinux:2023
      options: --privileged
    needs: setup_gpg_key
    
    steps:
      - name: Install tar and gzip for actions/checkout
        run: |
          dnf -y install tar gzip

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update dnf and install basic dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf -y groupinstall 'Development Tools'
          dnf -y install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            wget \
            cmake \
            gcc-c++ \
            libpng-devel \
            libtiff-devel \
            zlib-devel \
            libwebp-devel \
            libjpeg-turbo-devel \
            libicu-devel \
            pango-devel \
            cairo-devel \
            rpm-build \
            autoconf-archive \
            patch \
            giflib-devel \
            libarchive-devel \
            libcurl-devel \
            openjpeg2-devel

      - name: Build Leptonica
        run: |
          echo "Building Leptonica ${{ matrix.leptonica_version }}"
          cd /tmp
          wget -O leptonica-${{ matrix.leptonica_version }}.tar.gz https://github.com/DanBloomberg/leptonica/archive/refs/tags/${{ matrix.leptonica_version }}.tar.gz
          tar -xzf leptonica-${{ matrix.leptonica_version }}.tar.gz
          cd leptonica-${{ matrix.leptonica_version }}
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Tesseract OCR
        run: |
          echo "Building Tesseract OCR ${{ matrix.tesseract_version }}"
          cd /tmp
          git clone https://github.com/tesseract-ocr/tesseract.git tesseract-ocr
          cd tesseract-ocr
          git checkout ${{ matrix.tesseract_version }}
          ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig
          tesseract --version

      - name: Prepare RPM build environment and Spec File for AL2023
        id: prepare_rpm_spec_al2023
        run: |
          echo "Creating RPM build directories and AL2023 spec file"
          mkdir -p ${HOME}/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          SPEC_FILE_PATH="${HOME}/rpmbuild/SPECS/tesseract-ocr-al2023.spec"
          
          # Generate changelog date in the correct format
          CHANGELOG_DATE=$(date +"%a %b %d %Y")

          # Use spec template and substitute variables
          sed -e "s/\${TESSERACT_VERSION}/${{ matrix.tesseract_version }}/g" \
              -e "s/\${LEPTONICA_VERSION}/${{ matrix.leptonica_version }}/g" \
              -e "s/\${DATE}/$CHANGELOG_DATE/g" \
              .github/workflows/spec-templates/amazonlinux2023.spec.template > "${SPEC_FILE_PATH}"
              
          # Copy the spec file for later upload
          cp "${SPEC_FILE_PATH}" tesseract-ocr-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}.spec
          
          # Create source tarballs (empty, as we're building from the installed files)
          mkdir -p ~/rpmbuild/SOURCES
          touch ~/rpmbuild/SOURCES/tesseract-${{ matrix.tesseract_version }}.tar.gz
          touch ~/rpmbuild/SOURCES/leptonica-${{ matrix.leptonica_version }}.tar.gz
          
          echo "SPEC_FILE_PATH=${SPEC_FILE_PATH}" >> $GITHUB_OUTPUT

      - name: Build RPM for Amazon Linux 2023
        run: |
          rpmbuild -bb ${HOME}/rpmbuild/SPECS/tesseract-ocr-al2023.spec --define "_sourcedir /tmp" --define "_topdir ${HOME}/rpmbuild"
          echo "Amazon Linux 2023 RPMs created:"
          find ${HOME}/rpmbuild/RPMS -name "*.rpm" -print

      - name: Upload Amazon Linux 2023 RPM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-rpm-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-al2023
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      - name: Upload Amazon Linux 2023 Spec File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-ocr-spec-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-al2023
          path: ~/rpmbuild/SPECS/tesseract-ocr-al2023.spec
          if-no-files-found: error

  publish_to_obs:
    needs: [build_and_package_tesseract, build_for_amazon_linux_2023]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tesseract_version: ["5.3.1"] # "5.3.4", "5.4.1", "5.5.1"
        leptonica_version: ["1.85.0"]  # "1.82.0", 
    
    steps:
      - name: Install OBS CLI (osc)
        run: |
          # Install pip if not available
          sudo apt-get update
          sudo apt-get install -y python3-pip
          
          # Install latest osc from PyPI to avoid imp module issues with Python 3.12
          pip3 install --user osc
          
          # Add pip user bin to PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-el8
          path: /tmp/tesseract-rpm-artifact

      - name: Download AlmaLinux 8 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-rhel8
          path: /tmp/tesseract-spec-artifact-rhel8

      - name: Download Amazon Linux 2023 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-al2023
          path: /tmp/tesseract-rpm-artifact-al2023

      - name: Download Amazon Linux 2023 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-al2023
          path: /tmp/tesseract-spec-artifact-al2023

      - name: List downloaded artifacts
        run: |
          echo "Downloaded RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact
          echo "Spec artifact contents for RHEL8:"
          ls -R /tmp/tesseract-spec-artifact-rhel8
          echo "Amazon Linux 2023 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2023
          echo "Amazon Linux 2023 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2023

      - name: Configure OBS credentials
        env:
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          echo "Configuring OBS access..."
          if [ -z "$OBS_PASSWORD" ]; then
            echo "Error: OBS_PASSWORD secret is not set. Cannot proceed with OBS publishing."
            exit 1
          fi
          
          # Create oscrc in the correct location
          mkdir -p ~/.config/osc
          cat << 'OBS_CONFIG_EOF' > ~/.config/osc/oscrc
          [general]
          apiurl = https://api.opensuse.org
          
          [https://api.opensuse.org]
          user = chethanuk
          pass = ${{ secrets.OBS_PASSWORD }}
          OBS_CONFIG_EOF
          chmod 600 ~/.config/osc/oscrc
          echo "OBS credentials configured."

      - name: Publish to OBS
        env:
          OBS_PROJECT: "home:chethanuk"
          OBS_PACKAGE: "tesseract5"
          SPEC_FILENAME_ENV: "tesseract-ocr.spec"
        run: |
          echo "Publishing RPM to OBS project ${OBS_PROJECT}/${OBS_PACKAGE}"
          cd /tmp
          
          # Test authentication first
          echo "Testing OBS authentication..."
          if ! osc ls "${OBS_PROJECT}" > /dev/null 2>&1; then
            echo "Error: Authentication failed. Please check OBS_PASSWORD secret."
            exit 1
          fi
          echo "Authentication successful."
          
          # Check if package exists, create if not
          if ! osc ls "${OBS_PROJECT}" | grep -q "^${OBS_PACKAGE}$"; then
            echo "Package ${OBS_PACKAGE} does not exist in project ${OBS_PROJECT}. Creating..."
            # Create package with description
            osc meta pkg "${OBS_PROJECT}" "${OBS_PACKAGE}" -F - << 'PKG_META_EOF'
          <package name="tesseract5" project="home:chethanuk">
            <title>Tesseract OCR 5</title>
            <description>Custom build of Tesseract OCR Engine with Leptonica</description>
          </package>
          PKG_META_EOF
          else
            echo "Package ${OBS_PACKAGE} already exists in project ${OBS_PROJECT}."
          fi
          
          osc checkout "${OBS_PROJECT}/${OBS_PACKAGE}"
          
          if [ ! -d "${OBS_PROJECT}/${OBS_PACKAGE}" ]; then
            echo "Error: OBS checkout failed. Directory ${OBS_PROJECT}/${OBS_PACKAGE} not found."
            exit 1
          fi
          cd "${OBS_PROJECT}/${OBS_PACKAGE}"
          
          # Remove old files
          rm -f *.rpm
          rm -f *.spec
          
          # Copy new RPM
          RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact -name "*.rpm" -type f -print -quit)
          if [ -z "$RPM_FILE_PATH" ]; then
            echo "Error: RPM file not found in /tmp/tesseract-rpm-artifact."
            exit 1
          fi
          SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-rhel8 -name "*.spec" -type f -print -quit)
          if [ -z "$SPEC_FILE_PATH" ]; then
            echo "Error: Spec file not found in /tmp/tesseract-spec-artifact-rhel8."
            exit 1
          fi
          
          # Find Amazon Linux 2023 files
          AL2023_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2023 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2023_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 RPM file not found."
            exit 1
          fi
          AL2023_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2023 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2023_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 Spec file not found."
            exit 1
          fi
          
          # Copy new RPM
          cp "$RPM_FILE_PATH" .
          echo "Copied RPM: $(basename "$RPM_FILE_PATH")"
          
          # Copy spec file
          cp "$SPEC_FILE_PATH" .
          echo "Copied spec file: $(basename "$SPEC_FILE_PATH")"
          
          # Copy Amazon Linux 2023 RPM
          cp "$AL2023_RPM_FILE_PATH" .
          echo "Copied Amazon Linux 2023 RPM: $(basename "$AL2023_RPM_FILE_PATH")"
          
          # Copy Amazon Linux 2023 spec file
          cp "$AL2023_SPEC_FILE_PATH" .
          echo "Copied Amazon Linux 2023 spec file: $(basename "$AL2023_SPEC_FILE_PATH")"
          
          # Add new files to OBS
          echo "Adding new files to OBS..."
          osc addremove
          
          # Check status
          echo "OBS status:"
          osc status
          
          # Commit changes
          if osc status | grep -q 'nothing to commit'; then
            echo "OBS: No changes to commit."
          else
            osc commit -m "Update Tesseract OCR to ${{ matrix.tesseract_version }} with Leptonica ${{ matrix.leptonica_version }} from GitHub Actions"
            echo "OBS commit successful."
          fi

  publish_to_github_release:
    needs: [build_and_package_tesseract, build_for_amazon_linux_2023]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tesseract_version: ["5.3.1"] # "5.3.4", "5.4.1", "5.5.1"
        leptonica_version: ["1.85.0"]  # "1.82.0", 
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-el8
          path: /tmp/tesseract-rpm-artifact

      - name: Download AlmaLinux 8 spec file artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-rhel8
          path: /tmp/tesseract-spec-artifact-rhel8

      - name: Download Amazon Linux 2023 RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-rpm-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-al2023
          path: /tmp/tesseract-rpm-artifact-al2023

      - name: Download Amazon Linux 2023 Spec File artifact
        uses: actions/download-artifact@v4
        with:
          name: tesseract-ocr-spec-${{ matrix.tesseract_version }}-${{ matrix.leptonica_version }}-al2023
          path: /tmp/tesseract-spec-artifact-al2023

      - name: List downloaded artifacts for release
        run: |
          echo "RPM artifact contents for release:"
          ls -R /tmp/tesseract-rpm-artifact
          echo "Spec artifact contents for release:"
          ls -R /tmp/tesseract-spec-artifact-rhel8
          echo "Amazon Linux 2023 RPM artifact contents:"
          ls -R /tmp/tesseract-rpm-artifact-al2023
          echo "Amazon Linux 2023 Spec artifact contents:"
          ls -R /tmp/tesseract-spec-artifact-al2023

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ matrix.tesseract_version }}-leptonica${{ matrix.leptonica_version }}
        run: |
          # Find RHEL 8 compatible files
          RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact -name "*.rpm" -type f -print -quit)
          if [ -z "$RPM_FILE_PATH" ]; then
            echo "Error: RPM file not found in /tmp/tesseract-rpm-artifact."
            exit 1
          fi
          SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-rhel8 -name "*.spec" -type f -print -quit)
          if [ -z "$SPEC_FILE_PATH" ]; then
            echo "Error: Spec file not found in /tmp/tesseract-spec-artifact-rhel8."
            exit 1
          fi
          
          # Find Amazon Linux 2023 files
          AL2023_RPM_FILE_PATH=$(find /tmp/tesseract-rpm-artifact-al2023 -name "*.rpm" -type f -print -quit)
          if [ -z "$AL2023_RPM_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 RPM file not found."
            exit 1
          fi
          AL2023_SPEC_FILE_PATH=$(find /tmp/tesseract-spec-artifact-al2023 -name "*.spec" -type f -print -quit)
          if [ -z "$AL2023_SPEC_FILE_PATH" ]; then
            echo "Error: Amazon Linux 2023 Spec file not found."
            exit 1
          fi
          
          # Create release notes file
          cat << 'RELEASE_NOTES_EOF' > release_notes.md
          Automated release of Tesseract OCR ${{ matrix.tesseract_version }} (custom build with Leptonica ${{ matrix.leptonica_version }}). 

          ## What's included:
          - AlmaLinux 8 RPM package (RHEL 8 compatible)
          - Amazon Linux 2023 RPM package
          - RPM spec files for both builds

          ## Installation:
          
          ### For RHEL 8 / AlmaLinux 8 / Rocky Linux 8:
          ```bash
          sudo rpm -i tesseract-ocr-custom-*el8*.rpm
          ```
          
          ### For Amazon Linux 2023:
          ```bash
          sudo rpm -i tesseract-ocr-custom-*amzn2023*.rpm
          ```
          
          ### Verify installation:
          ```bash
          tesseract --version
          ```

          ## Features:
          - Built with Leptonica ${{ matrix.leptonica_version }}
          - Includes support for multiple image formats (PNG, TIFF, JPEG, WebP)
          - Full Unicode support via libicu
          - Optimized for performance with parallel processing

          ## Build Configuration:
          - RHEL 8 compatible build: AlmaLinux 8 (GCC 8+)
          - Amazon Linux 2023 build: Amazon Linux 2023 (GCC 11+)
          - Build type: Release with optimizations
          - Install prefix: /usr/local

          This package is also available on OpenSUSE Build Service:
          https://build.opensuse.org/package/show/home:chethanuk/tesseract5
          RELEASE_NOTES_EOF
          
          # Check if release exists
          echo "Checking if release $TAG_NAME exists..."
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Updating assets..."
            
            # Delete existing assets with the same names to avoid conflicts
            echo "Removing old assets if they exist..."
            for asset in "$(basename "$RPM_FILE_PATH")" "$(basename "$SPEC_FILE_PATH")" "$(basename "$AL2023_RPM_FILE_PATH")" "$(basename "$AL2023_SPEC_FILE_PATH")"; do
              if gh release view "$TAG_NAME" --json assets -q ".assets[] | select(.name == \"$asset\") | .name" | grep -q "$asset"; then
                echo "Deleting existing asset: $asset"
                gh release delete-asset "$TAG_NAME" "$asset" -y
              fi
            done
            
            # Upload new assets to existing release
            echo "Uploading new assets to existing release..."
            gh release upload "$TAG_NAME" \
              "${RPM_FILE_PATH}" \
              "${SPEC_FILE_PATH}" \
              "${AL2023_RPM_FILE_PATH}" \
              "${AL2023_SPEC_FILE_PATH}" \
              --clobber
            
            # Update release notes
            echo "Updating release notes..."
            gh release edit "$TAG_NAME" \
              --notes-file release_notes.md
            
            echo "GitHub Release updated with new assets."
          else
            # Create new release
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "Tesseract OCR ${{ matrix.tesseract_version }} with Leptonica ${{ matrix.leptonica_version }}" \
              --notes-file release_notes.md \
              "${RPM_FILE_PATH}" \
              "${SPEC_FILE_PATH}" \
              "${AL2023_RPM_FILE_PATH}" \
              "${AL2023_SPEC_FILE_PATH}"
            
            echo "GitHub Release created and assets uploaded."
          fi

  verify_github_release:
    needs: publish_to_github_release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tesseract_version: ["5.3.1"] # "5.3.4", "5.4.1", "5.5.1"
        leptonica_version: ["1.85.0"]  # "1.82.0", 
        os: ["almalinux:8", "amazonlinux:2023"]
        include:
          - os: "almalinux:8"
            os_name: "el8"
            pkg_manager: "dnf"
          - os: "amazonlinux:2023"
            os_name: "al2023"
            pkg_manager: "dnf"
    container:
      image: ${{ matrix.os }}
      options: --privileged
    
    steps:
      - name: Install prerequisites
        run: |
          ${{ matrix.pkg_manager }} -y update
          ${{ matrix.pkg_manager }} -y install wget curl

      - name: Wait for release to be available
        run: |
          echo "Waiting 30 seconds for GitHub release propagation..."
          sleep 30

      - name: Download RPM from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ matrix.tesseract_version }}-leptonica${{ matrix.leptonica_version }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          
          # Download the RPM package
          wget -O tesseract-ocr.rpm \
            "${REPO_URL}/releases/download/${TAG_NAME}/tesseract-ocr-${{ matrix.tesseract_version }}-1.${{ matrix.os_name }}.x86_64.rpm" \
            || { echo "Failed to download RPM"; exit 1; }
          
          # Verify the file was downloaded
          ls -la tesseract-ocr.rpm

      - name: Install Tesseract OCR from RPM
        run: |
          # Install the RPM with automatic dependency resolution
          ${{ matrix.pkg_manager }} -y install ./tesseract-ocr.rpm

      - name: Verify Installation
        run: |
          # Check if tesseract is installed
          which tesseract || { echo "Tesseract binary not found!"; exit 1; }
          
          # Check version
          tesseract --version
          
          # Verify expected version
          tesseract --version 2>&1 | grep -q "${{ matrix.tesseract_version }}" || \
            { echo "Version mismatch! Expected ${{ matrix.tesseract_version }}"; exit 1; }
          
          # Verify leptonica version
          tesseract --version 2>&1 | grep -q "leptonica-${{ matrix.leptonica_version }}" || \
            { echo "Leptonica version mismatch! Expected ${{ matrix.leptonica_version }}"; exit 1; }

      - name: Test Tesseract Functionality
        run: |
          # Create a simple test image with text
          ${{ matrix.pkg_manager }} -y install ImageMagick || true
          
          # If ImageMagick is not available, download a test image
          if ! command -v convert &> /dev/null; then
            echo "Downloading test image..."
            wget -O test.png https://raw.githubusercontent.com/tesseract-ocr/test/main/testing/eurotext.png || \
              { echo "Creating simple test..."; echo "TEST" > test.txt; }
          else
            # Create test image with ImageMagick
            convert -size 200x50 xc:white -font DejaVu-Sans -pointsize 20 \
              -fill black -annotate +25+35 'Hello World' test.png
          fi
          
          # Run OCR on the test image (if image exists)
          if [ -f test.png ]; then
            tesseract test.png output
            echo "OCR Output:"
            cat output.txt || echo "No output file generated"
          fi
          
          # Test with list-langs
          echo "Available languages:"
          tesseract --list-langs

      - name: Check installed files
        run: |
          # List installed files
          rpm -ql tesseract-ocr
          
          # Check for training data
          ls -la /usr/share/tesseract/tessdata/ || echo "No tessdata directory found"

  verify_obs_packages:
    needs: publish_to_obs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tesseract_version: ["5.3.1"] # "5.3.4", "5.4.1", "5.5.1"
        leptonica_version: ["1.85.0"]  # "1.82.0", 
        os: ["opensuse/leap:15.5", "almalinux:8", "amazonlinux:2023"]
        include:
          - os: "opensuse/leap:15.5"
            os_name: "opensuse"
            pkg_manager: "zypper"
            repo_type: "opensuse"
          - os: "almalinux:8"
            os_name: "el8"
            pkg_manager: "dnf"
            repo_type: "rhel"
          - os: "amazonlinux:2023"
            os_name: "al2023"
            pkg_manager: "dnf"
            repo_type: "rhel"
    container:
      image: ${{ matrix.os }}
      options: --privileged
    
    steps:
      - name: Install prerequisites
        run: |
          if [ "${{ matrix.pkg_manager }}" = "zypper" ]; then
            zypper --non-interactive update
            zypper --non-interactive install wget curl
          else
            ${{ matrix.pkg_manager }} -y update
            ${{ matrix.pkg_manager }} -y install wget curl
          fi

      - name: Wait for OBS to sync
        run: |
          echo "Waiting 60 seconds for OBS repository sync..."
          sleep 60

      - name: Add OBS Repository
        env:
          OBS_PROJECT: home:chethanuk1989
          OBS_PACKAGE: tesseract-ocr
        run: |
          if [ "${{ matrix.repo_type }}" = "opensuse" ]; then
            # For openSUSE
            zypper --non-interactive addrepo \
              "https://download.opensuse.org/repositories/${OBS_PROJECT//://}/openSUSE_Leap_15.5/" \
              "tesseract-obs"
            zypper --non-interactive --gpg-auto-import-keys refresh
          elif [ "${{ matrix.os_name }}" = "el8" ]; then
            # For AlmaLinux 8 / RHEL 8
            cat > /etc/yum.repos.d/tesseract-obs.repo << EOF
          [tesseract-obs]
          name=Tesseract OCR from OBS
          baseurl=https://download.opensuse.org/repositories/${OBS_PROJECT//://}/RHEL_8/
          enabled=1
          gpgcheck=1
          gpgkey=https://download.opensuse.org/repositories/${OBS_PROJECT//://}/RHEL_8/repodata/repomd.xml.key
          EOF
            ${{ matrix.pkg_manager }} -y install epel-release
            ${{ matrix.pkg_manager }} -y makecache
          else
            # For Amazon Linux 2023
            cat > /etc/yum.repos.d/tesseract-obs.repo << EOF
          [tesseract-obs]
          name=Tesseract OCR from OBS
          baseurl=https://download.opensuse.org/repositories/${OBS_PROJECT//://}/AmazonLinux_2023/
          enabled=1
          gpgcheck=1
          gpgkey=https://download.opensuse.org/repositories/${OBS_PROJECT//://}/AmazonLinux_2023/repodata/repomd.xml.key
          EOF
            ${{ matrix.pkg_manager }} -y makecache
          fi

      - name: Import GPG Key
        env:
          OBS_PROJECT: home:chethanuk1989
        run: |
          if [ "${{ matrix.repo_type }}" = "rhel" ]; then
            # Import the GPG key for RPM-based systems
            if [ "${{ matrix.os_name }}" = "el8" ]; then
              rpm --import "https://download.opensuse.org/repositories/${OBS_PROJECT//://}/RHEL_8/repodata/repomd.xml.key"
            else
              rpm --import "https://download.opensuse.org/repositories/${OBS_PROJECT//://}/AmazonLinux_2023/repodata/repomd.xml.key"
            fi
          fi

      - name: Install Tesseract from OBS
        run: |
          if [ "${{ matrix.pkg_manager }}" = "zypper" ]; then
            zypper --non-interactive install tesseract-ocr
          else
            # Try to install specific version if available
            ${{ matrix.pkg_manager }} -y install tesseract-ocr-${{ matrix.tesseract_version }} || \
              ${{ matrix.pkg_manager }} -y install tesseract-ocr
          fi

      - name: Verify Installation
        run: |
          # Check if tesseract is installed
          which tesseract || { echo "Tesseract binary not found!"; exit 1; }
          
          # Check version
          echo "Installed Tesseract version:"
          tesseract --version
          
          # Check for expected version (may not match exactly due to OBS build)
          tesseract --version 2>&1 | grep -i "tesseract" || \
            { echo "Tesseract version info not found!"; exit 1; }

      - name: Test Tesseract Functionality
        run: |
          # Install ImageMagick for test image creation
          if [ "${{ matrix.pkg_manager }}" = "zypper" ]; then
            zypper --non-interactive install ImageMagick || true
          else
            ${{ matrix.pkg_manager }} -y install ImageMagick || true
          fi
          
          # Download or create test image
          if ! command -v convert &> /dev/null; then
            echo "Downloading test image..."
            wget -O test.png https://raw.githubusercontent.com/tesseract-ocr/test/main/testing/eurotext.png || \
              { echo "Creating simple test..."; echo "TEST" > test.txt; }
          else
            # Create test image with ImageMagick
            convert -size 200x50 xc:white -font DejaVu-Sans -pointsize 20 \
              -fill black -annotate +25+35 'Hello World' test.png || \
              wget -O test.png https://raw.githubusercontent.com/tesseract-ocr/test/main/testing/eurotext.png
          fi
          
          # Run OCR on the test image
          if [ -f test.png ]; then
            tesseract test.png output
            echo "OCR Output:"
            cat output.txt || echo "No output file generated"
          fi
          
          # Test language data
          echo "Available languages:"
          tesseract --list-langs

      - name: Check Package Information
        run: |
          if [ "${{ matrix.pkg_manager }}" = "zypper" ]; then
            # Show package info on openSUSE
            zypper info tesseract-ocr
          else
            # Show package info on RPM-based systems
            rpm -qi tesseract-ocr
            echo "Package files:"
            rpm -ql tesseract-ocr | head -20
          fi

      - name: Verify Package Signature
        run: |
          if [ "${{ matrix.repo_type }}" = "rhel" ]; then
            # Verify RPM signature
            rpm -K $(rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm\n' | grep tesseract) 2>/dev/null || \
              echo "Note: Package signature verification requires the actual RPM file"
          fi

  workflow_summary:
    name: Workflow Summary
    needs: [setup_gpg_key, build_and_package_tesseract, build_for_amazon_linux_2023, publish_to_obs, publish_to_github_release, verify_github_release, verify_obs_packages]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Check workflow status
        run: |
          echo "## Tesseract OCR Multi-Version Build Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Build Matrix" >> $GITHUB_STEP_SUMMARY
          echo "- **Tesseract Versions**: 5.3.1, 5.3.4, 5.4.1, 5.5.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Leptonica Versions**: 1.82.0, 1.85.0" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Combinations**: 8 (4 Tesseract × 2 Leptonica)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Platforms**: AlmaLinux 8, Amazon Linux 2023" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Security Setup" >> $GITHUB_STEP_SUMMARY
          echo "- GPG Key Setup: ${{ needs.setup_gpg_key.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Package Signing: Enabled with GPG key" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Build Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "- AlmaLinux 8 builds: ${{ needs.build_and_package_tesseract.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Amazon Linux 2023 builds: ${{ needs.build_for_amazon_linux_2023.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Publishing Status" >> $GITHUB_STEP_SUMMARY
          echo "- OBS Publishing: ${{ needs.publish_to_obs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release Publishing: ${{ needs.publish_to_github_release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Verification Status" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release Verification: ${{ needs.verify_github_release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- OBS Package Verification: ${{ needs.verify_obs_packages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.verify_github_release.result }}" = "success" ] && [ "${{ needs.verify_obs_packages.result }}" = "success" ]; then
            echo "✅ **All verifications passed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some verifications may have failed. Please check the logs.**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### From GitHub Releases:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo '# Download and install specific version' >> $GITHUB_STEP_SUMMARY
          echo 'wget https://github.com/${{ github.repository }}/releases/download/vX.X.X-leptonicaY.Y.Y/tesseract-ocr-X.X.X-1.el8.x86_64.rpm' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dnf install ./tesseract-ocr-X.X.X-1.el8.x86_64.rpm' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### From OBS Repository:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo '# Add OBS repository' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dnf config-manager --add-repo https://download.opensuse.org/repositories/home:chethanuk1989/RHEL_8/home:chethanuk1989.repo' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dnf install tesseract-ocr' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
      - name: Report any failures
        if: |
          needs.build_and_package_tesseract.result == 'failure' ||
          needs.build_for_amazon_linux_2023.result == 'failure' ||
          needs.publish_to_obs.result == 'failure' ||
          needs.publish_to_github_release.result == 'failure' ||
          needs.verify_github_release.result == 'failure' ||
          needs.verify_obs_packages.result == 'failure'
        run: |
          echo "❌ Workflow had failures. Please check the logs for details." >> $GITHUB_STEP_SUMMARY
          exit 1
